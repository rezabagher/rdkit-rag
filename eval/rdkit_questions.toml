# Retrieval evaluation set for rdkit-rag on the RDKit codebase.
#
# Each question lists where the answer is implemented. A retrieved chunk
# counts as relevant when its file matches and, if a symbol is given, its
# symbol name is that symbol (or ends with "::symbol" / ".symbol", so
# "Atom::calcExplicitValence" matches "calcExplicitValence").
#
# The lists name the primary implementation only. A hit on a header, a
# Python wrapper or a test is counted as a miss, so the scores are a lower
# bound on what a user would consider a useful answer.
#
# category:
#   concept    - plain-English question that avoids code names
#   identifier - question that names the function or class
#
# Run with:  rdkit-rag eval

rdkit_commit = "ce08c344e86dbb07c86526cca2517436b1e41b02"

